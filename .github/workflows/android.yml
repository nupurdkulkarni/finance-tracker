name: Build NuPra Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK (NuPra Finance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install npm dependencies
        run: npm install

      - name: Build Android APK with EAS Local
        env:
          EAS_NO_VCS: '1'
        run: |
          mkdir -p build-output
          eas build --platform android --profile preview --local --non-interactive --output="build-output/NuPra Finance.apk"

      - name: Upload NuPra Finance APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuPra-Finance-APK
          path: build-output/NuPra Finance.apk
