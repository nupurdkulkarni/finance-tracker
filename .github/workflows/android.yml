name: Build NuPra Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK (NuPra Finance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Expo Prebuild Android (Clean)
        run: npx --yes expo prebuild --platform android --clean

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} "build-output/NuPra Finance.apk" \;

      - name: Upload NuPra Finance APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuPra-Finance-APK
          path: build-output/NuPra Finance.apk
