name: Build NuPra Finance APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build Android APK (NuPra Finance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK to NuPra Finance.apk
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk "build-output/NuPra Finance.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuPra-Finance-APK
          path: build-output/NuPra Finance.apk
